plugins {
    id 'fabric-loom' version '1.7.4'
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.ladysnake.org/releases' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Satin 2.0.0 is built for 1.21.1 and is shipped jar-in-jar.
    modImplementation "org.ladysnake:satin:2.0.0"
    include "org.ladysnake:satin:2.0.0"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.compilerArgs += ['-Xdiags:verbose']
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

loom {
    accessWidenerPath = file('src/main/resources/sandy.accesswidener')
}

// Keep mod metadata out of the sources jar so it can't be mistaken for a runnable mod.
tasks.named('sourcesJar') {
    exclude 'fabric.mod.json'
    exclude 'sandy.accesswidener'
    exclude 'sandy.mixins.json'
    exclude 'sandy.client.mixins.json'
    exclude 'sandevistan-refmap.json'
    exclude 'client-sandevistan-refmap.json'
}
