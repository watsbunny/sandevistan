plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://maven.ladysnake.org/releases' }
}

legacyForge {
    enable {
        neoForgeVersion = project.minecraft_version + '-' + project.forge_version
    }
    accessTransformers.from 'src/main/resources/META-INF/accesstransformer.cfg'

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

mixin {
    add sourceSets.main, "sandevistan-refmap.json"
    config "sandy.mixins.json"
    config "sandy.client.mixins.json"
}

dependencies {
    compileOnly files('libs/satin-1.14.0-neoforge+1.20.1.jar')
    jarJar files('libs/satin-1.14.0-neoforge+1.20.1.jar')
    compileOnly "io.github.llamalad7:mixinextras-common:0.3.5"
    implementation "io.github.llamalad7:mixinextras-forge:0.3.5"
    jarJar(implementation("io.github.llamalad7:mixinextras-forge:0.3.5"))
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching(['META-INF/mods.toml']) {
        expand(
                mod_version: project.version,
                minecraft_version: project.minecraft_version,
                forge_version: project.forge_version
        )
    }
}

jar {
    manifest.attributes([
            'MixinConfigs': "sandy.mixins.json,sandy.client.mixins.json"
    ])
}
